<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F7A5C"/>
      <stop offset="100%" stop-color="#0E4A38"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C14E"/>
      <stop offset="100%" stop-color="#E8A93A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Two supporting hands cupped shape -->
  <path d="M96 300
           C 96 300, 150 230, 210 250
           C 230 256, 240 275, 236 296
           C 232 318, 214 330, 214 330
           L 298 330
           C 298 330, 280 318, 276 296
           C 272 275, 282 256, 302 250
           C 362 230, 416 300, 416 300
           C 416 300, 400 380, 320 400
           C 290 407, 256 400, 256 400
           C 256 400, 222 407, 192 400
           C 112 380, 96 300, 96 300 Z"
        fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Heart resting in the hands -->
  <path d="M256 210
           C 240 180, 196 180, 180 212
           C 164 244, 190 274, 256 320
           C 322 274, 348 244, 332 212
           C 316 180, 272 180, 256 210 Z"
        fill="url(#heart)"/>

  <!-- Arabic mark: عون, simplified as a small crescent accent -->
  <circle cx="256" cy="150" r="10" fill="#F2C14E"/>
</svg>
